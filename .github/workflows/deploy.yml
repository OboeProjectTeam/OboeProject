name: Build and Deploy Vue + Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout source
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3. Cache node_modules
    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    # 4. Inject Firebase ENV
    - name: Inject Firebase ENV (.env)
      run: |
        echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> frontend/.env
        echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> frontend/.env
        echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> frontend/.env
        echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> frontend/.env
        echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> frontend/.env
        echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> frontend/.env
        echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> frontend/.env

    # 5. Inject backend ENV (.env)
    - name: Inject backend ENV (.env)
      run: |
        echo "SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}" >> backend/Oboe/.env
        echo "SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> backend/Oboe/.env
        echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> backend/Oboe/.env

        echo "SPRING_MAIL_USERNAME=${{ secrets.SPRING_MAIL_USERNAME }}" >> backend/Oboe/.env
        echo "SPRING_MAIL_PASSWORD=${{ secrets.SPRING_MAIL_PASSWORD }}" >> backend/Oboe/.env

        echo "FILE_UPLOAD_DIR=${{ secrets.FILE_UPLOAD_DIR }}" >> backend/Oboe/.env

        echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> backend/Oboe/.env
        echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> backend/Oboe/.env

        echo "FACEBOOK_CLIENT_ID=${{ secrets.FACEBOOK_CLIENT_ID }}" >> backend/Oboe/.env
        echo "FACEBOOK_CLIENT_SECRET=${{ secrets.FACEBOOK_CLIENT_SECRET }}" >> backend/Oboe/.env

    # 6. Build frontend
    - name: Build frontend
      working-directory: frontend
      run: |
        npm install --prefer-offline --frozen-lockfile
        npm run build

    # 7. Clean old frontend dist on server
    - name: Clean dist folder on server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ubuntu
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          rm -rf /var/www/OboeProject/frontend/dist/*
          echo "Old dist cleaned."

    # 8. Upload frontend to server
    - name: Upload frontend dist to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ubuntu
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "frontend/dist/**"
        target: "/var/www/OboeProject/frontend/dist/"
        overwrite: true

    # 9. Restart frontend (PM2)
    - name: Restart frontend via SSH (PM2)
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ubuntu
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          if pm2 list | grep -q oboe-frontend; then
            pm2 restart oboe-frontend
          else
            pm2 start /var/www/OboeProject/frontend/dist --name oboe-frontend
          fi

    # 10. Grant execute permission to mvnw
    - name: Make mvnw executable
      run: chmod +x backend/Oboe/mvnw

    # 11. Prevent unsafe ddl-auto
    - name: Validate ddl-auto safety
      run: |
        if grep -E 'ddl-auto\s*=\s*(update|create|create-drop)' backend/Oboe/src/main/resources/application.properties; then
          echo " ddl-auto đang ở chế độ nguy hiểm!"
          exit 1
        fi

    # 12. Setup Java
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # 13. Build backend (Spring Boot)
    - name: Build backend with Maven
      working-directory: backend/Oboe
      run: ./mvnw clean package -DskipTests

    # 14. Upload .jar to GitHub Artifact (debug backup)
    - name: Upload backend JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: oboe-backend-jar
        path: backend/Oboe/target/Oboe-0.0.1-SNAPSHOT.jar

    # 15. Upload backend jar to server
    - name: Upload backend JAR to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ubuntu
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "backend/Oboe/target/Oboe-0.0.1-SNAPSHOT.jar"
        target: "/var/www/OboeProject/backend/"
        overwrite: true

    # 16. Restart backend (PM2)
    - name: Restart backend via SSH (PM2)
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ubuntu
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /var/www/OboeProject/backend
          export $(cat .env | xargs)
          if pm2 list | grep -q oboe-backend; then
            pm2 delete oboe-backend
          fi
          pm2 start java --name oboe-backend -- -jar Oboe-0.0.1-SNAPSHOT.jar
          echo "Backend restarted"
